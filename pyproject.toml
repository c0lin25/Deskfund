[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deskfund"
version = "0.1.0"
description = "Desktop quant platform: data -> signals -> portfolio -> backtest -> execution -> attribution"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["deskfund*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
